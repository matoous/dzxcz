[package]
name = "cli"
version = "0.1.0"
edition = "2024"
default-run = "dzx"

[[bin]]
name = "dzx"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = [
  "derive",
  "string",
  "env",
  "wrap_help",
] }
jiff = "0.2.23"
kamadak-exif = "0.6.1"
reqwest = {version = "0.13.2", features = ["blocking", "json"]}
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
serde_yml = "0.0.12"
tempfile = "3.27.0"

[profile.release]
lto = "thin"

[profile.opt]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
